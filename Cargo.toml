[package]
name = "contaminate"
version = "0.1.0"
edition = "2024"
description = "Sprinkle static strings from a wordlist into a binary, for testing binary-inspection tools"
build = "build.rs"

[features]
default = ["wordlist-canary"]
# Each `wordlist-<name>` feature pulls in `wordlists/<name>.txt`.
wordlist-artifacts = []
wordlist-canary = []
wordlist-crypto = []
wordlist-cve = []
wordlist-edge-cases = []
wordlist-evade = []
wordlist-hashes = []
wordlist-network = []
wordlist-paths = []
wordlist-phishing = []
wordlist-pii = []
wordlist-secrets = []
wordlist-suspicious = []
wordlist-unicode = []
all-wordlists = [
    "wordlist-artifacts",
    "wordlist-canary",
    "wordlist-crypto",
    "wordlist-cve",
    "wordlist-edge-cases",
    "wordlist-evade",
    "wordlist-hashes",
    "wordlist-network",
    "wordlist-paths",
    "wordlist-phishing",
    "wordlist-pii",
    "wordlist-secrets",
    "wordlist-suspicious",
    "wordlist-unicode",
]

[dependencies]
